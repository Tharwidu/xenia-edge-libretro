# Xenia Edge - per-core RetroArch override
#
# RetroArch loads this automatically whenever the Xenia Edge core is active,
# and it overrides the global retroarch.cfg. Nothing else needs changing.
#
# WHY THIS EXISTS
# The Xbox 360 pad has an independent d-pad and left analog stick. RetroArch's
# analog_dpad_mode setting can double the left stick onto the d-pad; when that
# is on, moving the stick also fires d-pad presses (menu/inventory scrolling
# while you walk). The stock RetroArch default is 0 (off), but the value varies
# between installs, so this file pins it off for this core regardless of what
# the global config says.
#
# This is a RetroArch input setting. A libretro core has no API to set it -
# the only input environment callbacks are descriptors/labels and device-type
# info, none of which change bindings. Hence a config file rather than a core fix.

input_player1_analog_dpad_mode = "0"
input_player2_analog_dpad_mode = "0"
input_player3_analog_dpad_mode = "0"
input_player4_analog_dpad_mode = "0"

# Do NOT add commented-out settings to this file, in any form. RetroArch
# rewrites override files on exit when config_save_on_exit is on, and a
# commented setting can come back uncommented. That happened here: a disabled
# video-driver line was reactivated against a RetroArch build that has no such
# driver, and every game launch failed. Keep optional tweaks in the README.
