name: Bug report
description: Something wrong with the libretro core.
labels: bug
body:
  - id: disclaimer
    type: markdown
    attributes:
      value: |
        This tracker is for the **libretro core** — packaging, frontend
        integration, core options, and anything the core itself does.

        **Please do not take problems with this core to the Xenia project's
        Discord, forums or issue trackers.** They did not build this and cannot
        support it. File it here instead.

        Emulation itself — how a game runs, looks or sounds — comes from Xenia
        Edge underneath. If the same thing happens in the standalone emulator
        with this core out of the picture, it is not a core bug, and how a
        specific title behaves is tracked by the community at
        https://github.com/xenia-canary/game-compatibility

        Before filing, please read
        [docs/libretro-configuration.md](https://github.com/Tharwidu/xenia-edge-libretro/blob/ra175-compat/docs/libretro-configuration.md).
        A per-game `.opt` replacing your global options, or an option missing
        from `retroarch-core-options.cfg` falling back to the core default,
        accounts for a good share of "it ignored my setting".

  - id: validation
    type: checkboxes
    attributes:
      label: Validation
      options:
        - label: This is about the libretro core, not general emulator support.
          required: true
        - label: I've read the configuration doc.
          required: true
        - label: I've checked this hasn't already been reported.
          required: true

  - id: version
    type: input
    attributes:
      label: Core version
      description: From the release zip, or the commit you built.
      placeholder: v0.3.0
    validations:
      required: true

  - id: frontend
    type: input
    attributes:
      label: Frontend and platform
      description: Which RetroArch build, on which OS, and whether it runs through Wine or Proton.
      placeholder: RetroArch 1.22.2, Windows 11
    validations:
      required: true

  - id: content
    type: input
    attributes:
      label: Game and container format
      description: Title, and whether it is an ISO, a GOD/SVOD package, XBLA/STFS or ZAR.
      placeholder: Zuma (XBLA/STFS, launched through a .x360 pointer)

  - id: problem
    type: textarea
    attributes:
      label: What happens
    validations:
      required: true

  - id: expected
    type: textarea
    attributes:
      label: What should happen instead
    validations:
      required: true

  - id: logfile
    type: textarea
    attributes:
      label: Log
      description: |
        Run RetroArch with `--verbose` and attach the log. The core's own lines
        are prefixed `[Xenia]` and are only emitted in verbose mode, so a log
        without them cannot show what the core did.

  - id: callstack
    type: textarea
    attributes:
      label: Callstack, if it crashed
