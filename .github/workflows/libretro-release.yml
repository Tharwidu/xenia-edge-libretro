name: libretro-release

# Builds redistributable libretro core binaries:
#   - Windows x64: clang-cl + static CRT (no VC++ redistributable needed)
#   - Linux x64:   clang, bundles libSDL3.so.0 (resolved via $ORIGIN rpath)
# On a v* tag push the zips are attached to a GitHub prerelease; a manual
# workflow_dispatch run just uploads them as workflow artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang lld libvulkan-dev liblz4-dev \
            libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxrender-dev libx11-xcb-dev \
            libxcb1-dev libgl-dev libfontconfig-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Download Slang shader compiler
        run: python3 xenia-build.py slang

      - name: Configure
        run: >
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DXENIA_BUILD_LIBRETRO=ON

      - name: Generate version.h
        run: >
          python3 -c "import importlib.util as u;
          s = u.spec_from_file_location('xb', 'xenia-build.py');
          m = u.module_from_spec(s); s.loader.exec_module(m);
          m.generate_version_h('build-ci')"

      - name: Build
        run: cmake --build build-ci --target xenia-libretro

      - name: Package
        run: |
          strip --strip-debug build-ci/bin/Linux/xenia_edge_libretro.so
          mkdir dist
          cp build-ci/bin/Linux/xenia_edge_libretro.so dist/
          # Ship the real SDL3 library under its soname (not a symlink).
          cp -L build-ci/bin/Linux/libSDL3.so.0 dist/
          cp libretro/xenia_edge_libretro.info dist/
          cp LICENSE dist/
          cd dist
          zip ../xenia_edge_libretro-linux-x64.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: xenia_edge_libretro-linux-x64.zip

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSVC environment: meson must detect cl for the spirv_to_dxil build,
      # and clang-cl needs the MSVC headers/libs + Windows SDK.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: pip install meson mako ninja pyyaml

      # The runner has no Vulkan SDK; the core only needs an import library
      # for the loader (headers come from third_party/Vulkan-Headers).
      # Synthesize vulkan-1.lib from the entry points the presenter links.
      - name: Create vulkan-1 import library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vulkan-stub/Lib | Out-Null
          @'
          LIBRARY vulkan-1.dll
          EXPORTS
          vkAllocateCommandBuffers
          vkAllocateMemory
          vkBeginCommandBuffer
          vkBindBufferMemory
          vkBindImageMemory
          vkCmdCopyBufferToImage
          vkCmdPipelineBarrier
          vkCreateBuffer
          vkCreateCommandPool
          vkCreateImage
          vkCreateImageView
          vkDestroyBuffer
          vkDestroyCommandPool
          vkDestroyImage
          vkDestroyImageView
          vkDeviceWaitIdle
          vkEndCommandBuffer
          vkFreeMemory
          vkGetBufferMemoryRequirements
          vkGetImageMemoryRequirements
          vkGetPhysicalDeviceMemoryProperties
          vkMapMemory
          vkQueueSubmit
          vkResetCommandBuffer
          vkUnmapMemory
          '@ | Set-Content vulkan-stub/vulkan-1.def
          lib /nologo /def:vulkan-stub/vulkan-1.def /machine:x64 /out:vulkan-stub/Lib/vulkan-1.lib
          "VULKAN_SDK=$PWD\vulkan-stub" >> $env:GITHUB_ENV

      - name: Download Slang shader compiler
        run: python xenia-build.py slang

      - name: Configure
        run: >
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DXENIA_BUILD_LIBRETRO=ON
          -DXE_STATIC_CRT=ON

      - name: Generate version.h
        run: >
          python -c "import importlib.util as u;
          s = u.spec_from_file_location('xb', 'xenia-build.py');
          m = u.module_from_spec(s); s.loader.exec_module(m);
          m.generate_version_h('build-ci')"

      - name: Build
        run: cmake --build build-ci --target xenia-libretro

      - name: Verify static CRT
        shell: pwsh
        run: |
          $imports = dumpbin /dependents build-ci/bin/Windows/xenia_edge_libretro.dll
          $bad = $imports | Select-String -Pattern 'VCRUNTIME|MSVCP'
          if ($bad) {
            Write-Error "DLL still imports the dynamic CRT: $bad"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build-ci/bin/Windows/xenia_edge_libretro.dll dist/
          Copy-Item libretro/xenia_edge_libretro.info dist/
          Copy-Item LICENSE dist/
          # Bundle the DirectX 12 runtime so the (faster) D3D12 backend works
          # out of the box. Pinned versions must match the D3D12SDKVersion (619)
          # the code expects; the core auto-falls back to Vulkan if absent.
          New-Item -ItemType Directory dist/D3D12 | Out-Null
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile dxc.zip
          Expand-Archive dxc.zip -DestinationPath dxc
          Copy-Item dxc/bin/x64/dxcompiler.dll dist/D3D12/
          Copy-Item dxc/bin/x64/dxil.dll dist/D3D12/
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/1.619.3" -OutFile agility.zip
          Expand-Archive agility.zip -DestinationPath agility
          Copy-Item agility/build/native/bin/x64/D3D12Core.dll dist/D3D12/
          @'
          xenia_edge_libretro.dll  -> RetroArch\cores\
          xenia_edge_libretro.info -> RetroArch\info\
          D3D12\ (folder)          -> next to retroarch.exe (RetroArch root)

          The D3D12 folder enables the faster Direct3D 12 backend and is used
          automatically when present. Without it, the core falls back to the
          self-contained Vulkan backend on its own.
          '@ | Set-Content dist/README-install.txt -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath xenia_edge_libretro-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: xenia_edge_libretro-win64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: '*.zip'
